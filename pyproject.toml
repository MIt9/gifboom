[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gifboom"
version = "0.1.0"
description = "Search, download, convert and process GIFs — CLI & AI skill"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "GifBoom Contributors" }]
keywords = ["gif", "giphy", "tenor", "cli", "video", "convert", "ai", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Utilities",
]

dependencies = [
  "typer>=0.12",
  "httpx>=0.27",
  "rich>=13",
  "Pillow>=10",
  "imageio[ffmpeg]>=2.34",
  "moviepy>=1.0.3",
  "diskcache>=5.6",
  "pydantic>=2",
  "pydantic-settings>=2",
  "anyio>=4",
]

[project.optional-dependencies]
tui = ["textual>=0.70"]
mcp = ["mcp>=1.0"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-httpx>=0.30",
  "ruff>=0.4",
  "mypy>=1.10",
  "hatch",
]

[project.scripts]
gifboom = "gifboom.cli:app"

[project.urls]
Homepage = "https://github.com/MIt9/gifboom"
Repository = "https://github.com/MIt9/gifboom"
"Bug Tracker" = "https://github.com/MIt9/gifboom/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/gifboom"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
